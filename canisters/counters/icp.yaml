# yaml-language-server: $schema=https://github.com/dfinity/icp-cli/raw/refs/tags/v1.2.0/docs/schemas/icp-yaml-schema.json
#
# icp-cli project configuration. This replaces the legacy `dfx.json`.
#
# The wasm is built by `icpp build-wasm`, so icp only has to pick it up. Its
# Candid interface travels with it, in the `icp:public candid:service` custom
# section that `icpp build-wasm` writes into the wasm.

canisters:
  - name: counters
    build:
      steps:
        - type: pre-built
          path: build/counters.wasm

networks:
  # A project-local replica, started with `icp network start`. icp-cli runs one
  # local network per project, and `port: 0` lets the OS assign a free ephemeral
  # port - so the demos never collide with each other or with another project.
  # The port changes on every start: never hardcode it, read it back from
  # `icp network status` (which is what icpp.smoketest does for you).
  - name: local
    mode: managed
    gateway:
      port: 0

environments:
  # These names are the values you pass to pytest as `--network=[local/ic]`.
  - name: local
    network: local
  - name: ic
    network: ic
